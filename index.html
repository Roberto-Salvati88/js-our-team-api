<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Team API</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container py-5">
    <h1 class="text-center mb-5">Our Team</h1>

    <div id="team-container" class="row g-4"></div>

    <h2 class="mt-5 mb-3">Aggiungi un membro</h2>
    <form id="member-form" class="row g-3">
      <div class="col-md-6">
        <input type="text" id="member-name" class="form-control" placeholder="Nome e cognome" required>
      </div>
      <div class="col-md-6">
        <input type="text" id="member-role" class="form-control" placeholder="Ruolo" required>
      </div>
      <div class="col-md-6">
        <input type="email" id="member-email" class="form-control" placeholder="Email" required>
      </div>
      <div class="col-md-6">
        <input type="text" id="member-img" class="form-control" placeholder="Immagine (es. img/male1.png)" required>
      </div>
      <div class="col-12">
        <button type="submit" class="btn btn-primary">Aggiungi</button>
      </div>
    </form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
